name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false   # zero dependencies; no go.sum

      - name: Set up Node for GitOps smoke TC
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check formatting
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean:"; echo "$out"; exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: GitOps smoke TC
        run: make test-smoke

      - name: Validate shell scripts
        run: bash -n scripts/build-release-artifacts.sh && bash -n scripts/install.sh

      - name: Build binary
        run: make build VERSION=ci-${{ github.sha }}

      - name: Self-check (run test-cli on its own repo)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          ./bin/test-cli detect .
          ./bin/test-cli doctor .
          diff_base=HEAD
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            diff_base="origin/$BASE_REF"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            diff_base="$EVENT_BEFORE"
          fi
          ./bin/test-cli run . --profile ci --diff-base "$diff_base" --fail-diff-coverage 80 --output-dir reports/test
          ./bin/test-cli generate-skill --out reports/skills

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-cli-reports
          path: reports/
          if-no-files-found: ignore

  cross-build:
    name: Cross-compile matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false   # zero dependencies; no go.sum
      - name: Build all platforms
        run: VERSION=ci INCLUDE_ARCHIVES=false bash scripts/build-release-artifacts.sh
